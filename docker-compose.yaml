services:
  db:
    image: postgres:16
    container_name: rastreador-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.0-alpine
    container_name: redis-server
    restart: always
    ports: 
      - '${REDIS_PORT}:6379'
    hostname: ${REDIS_HOST}
    volumes:
      - redis_data:/data
    
    

volumes:
  postgres_data:
  redis_data: